# Apply after molt-qwen3-4b-chat-lr4e-5.yaml.
# Controlled repeat with an exactly 5x lower sparsity coefficient, intended to
# explore a looser L0 regime while preserving the successful 4e-5 LR recipe.
trainer:
  logger:
    init_args:
      name: "molt-qwen3-4b-chat-layer22-N80-lr4e-5-sparsity3e-5"
  callbacks:
    - class_path: crosslayer_transcoder.utils.callbacks.TimedCheckpointCallback
      init_args:
        checkpoint_dir: "checkpoints/molt-qwen3-4b/layer-22/chat-ultrachat-lr4e-5-sparsity3e-5"
        interval_minutes: 90
        filename: "training.ckpt"
model:
  init_args:
    lambda_sparsity: 3e-5
data:
  init_args:
    shared_memory_name: "activation_buffer_qwen3_4b_chat_layer22_lr4e_5_sparsity3e_5"
    wandb_logging:
      enabled: true
      project: "debug-molt"
      run_name: "data-generator-qwen3-4b-chat-ultrachat-lr4e-5-sparsity3e-5"
      tags: ["data-generation", "qwen3", "chat", "ultrachat", "lr4e-5", "sparsity3e-5"]
      save_dir: "./wandb"
      log_interval: 5.0
ckpt_path: null
