# Single-GPU configuration for RTX 5090 (32 GB VRAM, 31 GB /dev/shm).
# Doubles N (50 -> 100) and max_steps (20k -> 40k) vs. molt-5090_20M_tokens_0_00015.yaml.
#
# Why: per the MOLT bulk-update post (transformer-circuits.pub/2025/bulk-update),
# training steps should scale proportionally to the number of features, and each 4x
# FLOPs increase comes from 2x params + 2x steps. Doubling N exactly doubles features
# (1550 -> 3100), latents (128k -> 256k), and params (~198M -> ~396M); doubling
# max_steps gives 40M tokens at batch_size=1000 -> 4x FLOPs vs. the 20M baseline.

seed_everything: 42

trainer:
  max_steps: 40_000  # 40M tokens at batch_size=1000
  val_check_interval: 1000000000  # replacement model for single layer doesn't make sense
  limit_val_batches: 1
  check_val_every_n_epoch: null
  enable_checkpointing: false  # We use custom end-of-training checkpoint
  num_sanity_val_steps: 0  # Can't run replacement model before standardizers are initialized
  accelerator: "gpu"
  devices: [0]  # Only one GPU on this machine
  accumulate_grad_batches: 2  # mini-batch=500, effective batch=1000 (matches N=50 baseline)
  # Memory tuning to fit N=100 (~395M params) on the 32 GB 5090 alongside the
  # GPU-resident GPT-2 data generator (~8 GiB):
  #   - bf16-mixed: halves activation/weight memory in the training pass.
  #   - mini-batch=500 + accumulate=2: peak forward activation `raw_recons` shrinks
  #     from [1000,3100,768] (9.5 GiB fp32 / 4.75 GiB bf16) to [500,3100,768]
  #     (~2.4 GiB bf16). Effective batch (1000), total tokens (40M), optimizer-step
  #     count (max_steps=40_000), and the linear sparsity ramp (keyed on
  #     global_step/max_steps) are all preserved vs. the original plan.
  # Note: bf16 is a numerical-regime change vs. the float32 N=50 baseline; the
  # 4× FLOPs comparison is approximate at the bit level but exact at the math level.
  precision: "bf16-mixed"
  logger:
    class_path: lightning.pytorch.loggers.WandbLogger
    init_args:
      project: "debug-molt"
      name: "molt-5090-0_00015-3100-256k-jumprelu-bf16-40M-N100"
      save_dir: "./wandb"
  callbacks:
    - class_path: crosslayer_transcoder.utils.callbacks.EndOfTrainingCheckpointCallback
      init_args:
        checkpoint_dir: "checkpoints/lam_0_00015_N100_40M"

model:
  class_path: crosslayer_transcoder.model.clt_lightning.MoltModule
  init_args:
    model:
      class_path: crosslayer_transcoder.model.molt.Molt
      init_args:
        d_acts: 768
        N: 100  # doubled from 50 -> features 1550 -> 3100, latents 128k -> 256k, params ~198M -> ~396M
        nonlinearity:
          class_path: crosslayer_transcoder.model.jumprelu.JumpReLU
          init_args:
            theta: 0.03
            bandwidth: 1.0
            n_layers: 1
            d_features: 3100  # = 31 * N (sum of N*mult across the 5 rank levels)

        input_standardizer:
          class_path: crosslayer_transcoder.model.standardize.DimensionwiseInputStandardizer
          init_args:
            n_layers: 12
            activation_dim: 768

        output_standardizer:
          class_path: crosslayer_transcoder.model.standardize.DimensionwiseOutputStandardizer
          init_args:
            n_layers: 12
            activation_dim: 768

    # Validation is gated to never fire (val_check_interval=1e9), so this metric
    # would never run anyway.
    replacement_model: null

    dead_features:
      class_path: crosslayer_transcoder.metrics.dead_features.DeadFeatures
      init_args:
        n_features: 120
        n_layers: 12
        return_per_layer: true
        return_log_freqs: true
        return_neuron_indices: true

    learning_rate: 2e-4
    compile: true
    lr_decay_step: 1000000000
    lr_decay_factor: 0.1

    lambda_sparsity: 0.00015
    c_sparsity: 100
    use_tanh: true

    # NOTE: For MoltModule these settings are inert. MOLT's dead-feature path
    # is hardcoded — it logs `metrics/dead_features` every step via
    # update_dead_features(gate) regardless of these flags. The DeadFeatures
    # torchmetrics instance configured above is also unused for MOLT.
    # TODO: wire MoltModule.training_step into the configurable path.
    compute_dead_features: true
    compute_dead_features_every: 500

data:
  class_path: crosslayer_transcoder.data.datamodule.ActivationDataModule
  init_args:
    # Buffer settings
    # 350k * 12 layers * 2 (in/out) * 768 dim * 4 bytes ≈ 25.8 GB — fits in /dev/shm (31 GB cap).
    buffer_size: 350_000
    n_in_out: 2
    n_layers: 12
    activation_dim: 768
    dtype: "float32"
    max_batch_size: 50000

    model_name: "openai-community/gpt2"
    model_dtype: "float32"

    # Dataset settings
    dataset_name: "Skylion007/openwebtext"
    dataset_split: "train"
    max_sequence_length: 1024

    generation_batch_size: 10
    refresh_interval: 0.1

    shared_memory_name: "activation_buffer"
    timeout_seconds: 30

    batch_size: 500  # halved from 1000; trainer.accumulate_grad_batches=2 restores effective batch=1000
    num_workers: 10
    prefetch_factor: 2
    shuffle: true
    persistent_workers: true
    pin_memory: true

    minimum_fill_threshold: 0.01

    use_shared_memory: true

    device_map: "cuda:0"
    deployment_policy: "gpu_only"

    wandb_logging:
      enabled: true
      project: "debug-molt"
      group: null
      run_name: "data-generator"
      tags: ["data-generation"]
      save_dir: "./wandb"
      log_interval: 5.0

ckpt_path: null
