# Multi-layer MoLT training on Gemma3-4B-it (text decoder), 2xB200 DDP.
#
# Topology: 2 ranks, each rank co-locates a Gemma3-4B-it activation generator
# and the MoLT trainer on its own B200 (179 GB usable VRAM each).
#
# Diff vs the 2xH200 sibling config (molt-multilayer-ddp-gemma3-4b-it-2gpu.yaml):
#   * batch_size: 512 → 1024  (B200's extra ~35 GB headroom lets us double
#     per-rank micro-batch, matching the original 4xH200 effective batch of
#     2048 — but in 2 ranks × 1024 instead of 4 ranks × 512).
#   * max_steps: 98000 → 49000  (effective batch doubled, so half the steps
#     for the same 100M-token budget).
#   * every_n_train_steps: 9800 → 4900  (10M-token cadence at 2x effective batch).
#   * num_workers: 4 → 4 (kept; the larger GPU + faster B200 benefits from a
#     few prefetch threads but more start hurting via pinned-mem shadows).
#
# Activation paths (model_arch=gemma3):
#   in  = layers[i].pre_feedforward_layernorm.input
#   out = layers[i].post_feedforward_layernorm.output
# (Gemma3 normalizes the MLP delta before the residual add, so the post-FF
# layernorm output is what gets added to the residual stream.)
#
# Sizing notes (per B200, 179 GB) for ranks=[128,64,32,16], N=50, batch=1024:
#   Gemma3-4B in bf16              ≈   8 GB    (in the generator subprocess)
#   MoLT params (4.5 B, fp32)      ≈  18 GB
#   Grads (fp32)                   ≈  18 GB
#   Adam moments (m+v, fp32)       ≈  36 GB
#   DDP grad buffer (fp32)         ≈  18 GB
#   bf16 working / cuBLAS          ≈   5 GB
#   Per-step autograd at batch=1024≈   5–10 GB  (with the transform_norm fix
#                                    in molt.py and per-Molt activation
#                                    checkpointing — the recompute peak only
#                                    holds one Molt's intermediates at a time)
#   Trainer total                  ≈ 105–115 GB
#   Generator process at gen=8     ≈  25 GB
#   Total per B200                 ≈ 130–140 GB  (~40 GB headroom)
#
# Why activation checkpointing is still required on B200 at this batch size:
#   Without ckpt, per-layer raw_recons + weighted_recons stash ≈ 4 GB at
#   batch=1024 in bf16 → × 34 layers ≈ 136 GB just for those. State + bf16
#   working = 100 GB. Total trainer would balloon to ~240 GB > 179 GB.
#   Ckpt drops the autograd cost to a few GB at the price of one extra
#   forward per backward (~30% per-step slowdown).
#
# /dev/shm budget:
#   100k samples/rank × 34 × 2 × 2560 × 4 B ≈ 70 GB/rank × 2 ranks ≈ 140 GB
#   (verify with `df -h /dev/shm` on the target box).
#
# Per-layer checkpoints are uploaded to HF (kylelovesllms/molt-sweeps under
# molt-multilayer-gemma3-4b-it-N50-100M-2gpu-b200-fp32weights/) and deleted
# locally — the local `checkpoints/` dir won't fill up that way.
#
# Expected wall clock: ~9 hours at ~1.5 it/s on B200 (2x H200 reference is
# 0.78 it/s × 98000 steps ≈ 34 hours; B200 ≈ 1.5–2x faster + half the steps).

seed_everything: 42

trainer:
  # 100M tokens at effective batch 2 × 1024 = 2048 -> ~48830 optimizer steps;
  # round to 49000. Lightning's max_steps counts optimizer steps.
  max_steps: 49_000
  val_check_interval: 1000000000
  limit_val_batches: 1
  check_val_every_n_epoch: null
  enable_checkpointing: false
  num_sanity_val_steps: 0
  accelerator: "gpu"
  devices: [0, 1]
  strategy: "ddp"
  accumulate_grad_batches: 1
  precision: "bf16-mixed"
  logger:
    class_path: lightning.pytorch.loggers.WandbLogger
    init_args:
      project: "debug-molt"
      name: "molt-multilayer-gemma3-4b-it-N50-100M-ddp-2gpu-b200"
      save_dir: "./wandb"
  callbacks:
    # 10M tokens at effective batch 2048 ≈ 4882 steps; round to 4900.
    - class_path: crosslayer_transcoder.utils.callbacks.MoltPerLayerCheckpointCallback
      init_args:
        checkpoint_dir: "checkpoints/molt-multilayer-gemma3-4b-it-N50-100M-ddp-2gpu-b200"
        every_n_train_steps: 4900
        hf_repo_id: "kylelovesllms/molt-sweeps"
        hf_repo_path: "molt-multilayer-gemma3-4b-it-N50-100M-2gpu-b200-fp32weights"
        delete_local_after_upload: true
        # Effective batch = 2 ranks × 1024 = 2048 tokens/step. Filenames use
        # tokens-processed (e.g. _tokens0010M035K) instead of step number.
        tokens_per_step: 2048

model:
  class_path: crosslayer_transcoder.model.clt_lightning.MultiLayerMoltModule
  init_args:
    model:
      class_path: crosslayer_transcoder.model.molt.MultiLayerMolt
      init_args:
        n_layers: 34
        d_acts: 2560
        # N=50 with ranks=[128, 64, 32, 16].
        # n_features per layer = 50*(1+2+4+8) = 750.
        # Per-layer params: Us+Vs ≈ 50*2*(1*128 + 2*64 + 4*32 + 8*16)*2560
        #   ≈ 131 M; ×34 layers ≈ 4.5 B.
        # Requires the transform_norm fix in molt.py (V^T V × U U^T identity)
        # to avoid materializing (n_transforms, d_acts, d_acts) intermediates
        # in the autograd graph.
        N: 50
        ranks: [128, 64, 32, 16]
        # Per-layer activation checkpointing — required at batch=1024 even
        # on B200 because per-layer raw_recons + weighted_recons stash
        # (~4 GB × 34 layers = 136 GB at bf16) would otherwise overflow.
        use_activation_checkpointing: true
        nonlinearity:
          class_path: crosslayer_transcoder.model.jumprelu.JumpReLU
          init_args:
            theta: 0.03
            bandwidth: 1.0
            n_layers: 1
            d_features: 750
        input_standardizer:
          class_path: crosslayer_transcoder.model.standardize.DimensionwiseInputStandardizer
          init_args:
            n_layers: 34
            activation_dim: 2560
        output_standardizer:
          class_path: crosslayer_transcoder.model.standardize.DimensionwiseOutputStandardizer
          init_args:
            n_layers: 34
            activation_dim: 2560

    replacement_model: null
    dead_features: null

    learning_rate: 2e-4
    compile: false
    lr_decay_step: 1000000000
    lr_decay_factor: 0.1

    lambda_sparsity: 0.00015
    c_sparsity: 100
    use_tanh: true

    compute_dead_features: false
    compute_dead_features_every: 500

data:
  class_path: crosslayer_transcoder.data.datamodule.ActivationDataModule
  init_args:
    # Per-rank buffer ≈ 70 GB; /dev/shm under DDP holds 2 of these.
    buffer_size: 100_000
    n_in_out: 2
    n_layers: 34
    activation_dim: 2560
    dtype: "float32"
    max_batch_size: 50000

    model_name: "google/gemma-3-4b-it"
    # bf16 generator: Gemma3-4B params + forward + KV fit comfortably with
    # plenty of room left for the MoLT trainer on the same GPU.
    model_dtype: "bfloat16"

    dataset_name: "Skylion007/openwebtext"
    dataset_split: "train"
    max_sequence_length: 1024

    # Gen batch 8 — leaves the generator at ~25 GB on the GPU. With B200's
    # extra headroom we could go higher, but the trainer at batch=1024
    # consumes ~3k acts/sec and gen=8 already emits ~16k acts/sec across
    # 2 ranks, so there's no throughput gain from pushing further.
    generation_batch_size: 8
    refresh_interval: 0.1

    shared_memory_name: "activation_buffer"  # datamodule appends _rank{N} under DDP
    timeout_seconds: 60

    # Per-GPU batch. Effective batch under DDP = 2 × 1024 = 2048
    # (matches the original 4xH200 config's effective batch in 2 ranks).
    batch_size: 1024
    num_workers: 4
    prefetch_factor: 2
    shuffle: true
    persistent_workers: true
    pin_memory: true

    # Wait for ≥1% buffer fill before training starts so step 0 sees real data.
    minimum_fill_threshold: 0.01

    use_shared_memory: true

    device_map: "cuda:0"  # rank-relative under DDP; datamodule resolves per rank
    deployment_policy: "gpu_only"
    model_arch: "gemma3"

    wandb_logging:
      enabled: true
      project: "debug-molt"
      group: null
      run_name: "data-generator-gemma3-ddp-2gpu-b200"  # datamodule appends -rank{N}
      tags: ["data-generation", "gemma3"]
      save_dir: "./wandb"
      log_interval: 5.0

ckpt_path: null
