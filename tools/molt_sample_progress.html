<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>MOLT · Expanding the sample</title>
<style>body{font:16px system-ui;color:#182c3b;background:#f4f7fa;max-width:760px;margin:10vh auto;padding:24px}main{background:white;border:1px solid #d9e2eb;border-radius:12px;padding:32px}h1{font-size:28px}p{line-height:1.6;color:#526576}progress{width:100%;height:22px;accent-color:#087969}a{color:#087969}#count{font-size:24px;font-weight:650;color:#182c3b}.badge{font-size:12px;letter-spacing:1px;color:#087969}</style></head>
<body><main><div class="badge">MOLT · QWEN3-4B · LAYER 22</div><h1>Expanding the held-out sample</h1><p id="count">Loading collection progress…</p><progress id="bar" max="10000000" value="0"></progress><p id="detail"></p><p>After collection, this page will become the feature explorer. LLM explanations will follow, using 32 concurrent requests.</p><p><a href="/">Open the existing dashboard</a> · <a href="/steer">Open steering</a></p></main>
<script>
async function update(){try{const response=await fetch('collection-progress.json',{cache:'no-store'});if(!response.ok)throw new Error();const p=await response.json();const target=p.target_tokens||10000000;document.getElementById('count').textContent=`${p.tokens.toLocaleString()} / ${target.toLocaleString()} tokens`;document.getElementById('bar').max=target;document.getElementById('bar').value=p.tokens;document.getElementById('detail').textContent=p.complete?'Collection complete. Building the feature explorer…':`${p.conversations.toLocaleString()} conversations · ${Math.round(p.tokens_per_second||0).toLocaleString()} tokens/second`+(p.tokens_per_second?` · about ${Math.ceil((target-p.tokens)/p.tokens_per_second/60)} minutes remaining`:'');if(p.complete)setTimeout(()=>location.reload(),10000)}catch{document.getElementById('detail').textContent='Waiting for the next saved collection chunk…'}}
update();setInterval(update,10000);
</script></body></html>
